    <link rel="stylesheet" href="css/challenges.css">
    
    <script>
        tailwind.config = {
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        thm: {
                            base: '#0d1117',
                            surface: '#161b22',
                            elevated: '#1f2937',
                            accent: '#ff4d6d',
                            accentDim: '#e0364d',
                            textPrimary: '#e6edf3',
                            textMuted: '#8b949e',
                            border: '#30363d'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Toggle Switch for Dark Theme */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #ff4d6d;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #ff4d6d;
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: #30363d;
            transition: all 0.3s;

        .toggle-label {
            width: 3rem;
            height: 1.5rem;
            background-color: #30363d;

        .nav-item.active {
            border-left: 4px solid #ff4d6d;

            background-color: #1f2937;
        }
        .nav-item {
            border-left: 4px solid transparent;
            color: #8b949e;
            background-color: transparent;
            border-top: none;
            border-right: none;
            border-bottom: 1px solid #30363d;
            cursor: pointer;
        }
        .nav-item:hover {
            background-color: #1f2937;
        }
        
        /* Reset button styles from global for tailwind */
        #root input, #root textarea, #root select, #root button { font-family: inherit; }
    </style>
</head>
<body>
    <!--  NAVBAR  -->
    <nav class="navbar" aria-label="Main navigation">
    <a href="index.html" class="logo">CTF<span>LABS</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="learn.html">Learn</a>
      <a href="challenges.html">Challenges</a>
      <a href="rules.html">Rules</a>
      <a href="create-room.html" class="active">Create Room</a>
      <div class="dropdown" role="navigation" aria-label="Profile menu">
        <a href="#" aria-haspopup="true">Profile </a>
        <div class="dropdown-content" role="menu">
          <a href="dashboard.html" role="menuitem">Dashboard</a>
          <a href="settings.html" role="menuitem">Settings</a>
          <a href="#" role="menuitem">Logout</a>
        </div>
      </div>
    </div>
  </nav>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Toggle({ checked, onChange, id }) {
            return (
                <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name={id} id={id} checked={checked} onChange={onChange} className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-thm-elevated border-4 appearance-none cursor-pointer" style={{ right: checked ? '0' : '1.5rem' }} />
                    <label htmlFor={id} className="toggle-label block overflow-hidden h-6 rounded-full bg-thm-border cursor-pointer"></label>
                </div>
            );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                this.setState({ errorInfo });
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ color: 'white', padding: '20px' }}>
                            <h1>React Error!</h1>
                            <p>{this.state.error && this.state.error.toString()}</p>
                            <pre>{this.state.errorInfo && this.state.errorInfo.componentStack}</pre>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [activeTab, setActiveTab] = useState('General Settings');
            const [history, setHistory] = useState([]);
            
            useEffect(() => {
                if (activeTab === 'ManageRooms') {
                    fetch('http://127.0.0.1:5000/api/rooms')
                        .then(res => res.json())
                        .then(data => setHistory(data.rooms || []))
                        .catch(err => console.error(err));
                }
            }, [activeTab]);
            const [formData, setFormData] = useState({
                title: 'Pentesting',
                description: 'testing',
                roomCode: 'pentesting4s',
                completionTime: 60,
                difficulty: 'Medium',
                cloning: false,
                access: false,
                privateMessage: '',
                teams: false,
                resetProgress: true,
                simpleRoom: false,
                publicEvent: false,
                tasks: [],
                categories: [],
                bannerUrl: '',
                avatarUrl: '',
                video1Enabled: false,
                video1Url: '',
                video1Title: '',
                video2Enabled: false,
                video2Url: '',
                video2Title: ''
            });
            const [showCreateModal, setShowCreateModal] = useState(false); // To mock the create modal screenshot
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [savedRoomId, setSavedRoomId] = useState(null);
            const navItems = [
                { name: 'General Settings' },
                { name: 'Design' },
                { name: 'Video' },
                { name: 'Stats' },
                { name: 'Categories' },
                { name: 'Tasks' },
                { name: 'Write-ups' },
                { name: 'Reset' },
                { name: 'Delete' }
            ];

            const handleSave = async () => {
                try {
                    const roomData = {
                        roomName: formData.title,
                        description: formData.description,
                        roomCode: formData.roomCode,
                        completionTime: formData.completionTime,
                        difficulty: formData.difficulty,
                        cloning: formData.cloning,
                        visibility: formData.access ? 'Public' : 'Private',
                        privateMessage: formData.privateMessage,
                        bannerUrl: formData.bannerUrl,
                        avatarUrl: formData.avatarUrl,
                        video1: formData.video1Enabled ? { url: formData.video1Url, title: formData.video1Title } : null,
                        video2: formData.video2Enabled ? { url: formData.video2Url, title: formData.video2Title } : null,
                        tasks: formData.tasks,
                        categories: formData.categories
                    };
                    const res = await fetch('http://127.0.0.1:5000/api/create_room', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(roomData)
                    });
                    const data = await res.json();
                    if (data.success) {
                        setSavedRoomId(data.room_id);
                        setShowSuccessModal(true);
                    } else {
                        alert('Error: ' + data.error);
                    }
                } catch (e) {
                    alert('Error saving room.');
                }
            };

            const fileInputRef = React.useRef(null);
            const [uploadTarget, setUploadTarget] = useState(null);

            const handleFileUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const uploadData = new FormData();
                uploadData.append('file', file);

                try {
                    const res = await fetch('http://localhost:5000/api/rooms/upload', {
                        method: 'POST',
                        body: uploadData
                    });
                    const data = await res.json();
                    if (data.success) {
                        if (uploadTarget === 'banner') {
                            setFormData({...formData, bannerUrl: 'http://localhost:5000' + data.url});
                        } else if (uploadTarget === 'avatar') {
                            setFormData({...formData, avatarUrl: 'http://localhost:5000' + data.url});
                        }
                    } else {
                        alert('Error uploading file: ' + data.error);
                    }
                } catch (err) {
                    alert('Error uploading file.');
                }
                
                // reset file input
                e.target.value = '';
            };

            return (
                <div className="max-w-6xl mx-auto mt-12 flex gap-8 pb-20">
                    <input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" accept="image/png, image/jpeg, image/svg+xml" />
                    {/* Hidden trigger for Manage Rooms */}
                    <button id="manage-btn" onClick={() => setActiveTab('ManageRooms')} className="hidden"></button>
                    
                    {/* Left Sidebar */}
                    <div className="w-64 flex-shrink-0">
                        <div className="bg-thm-elevated border border-thm-border text-thm-textPrimary px-4 py-3 rounded mb-6 text-sm font-bold flex items-center justify-between shadow-lg">
                            <span className="flex items-center gap-2"><span className="text-thm-accent">🔒</span> Private room</span>
                            <button onClick={() => setActiveTab('ManageRooms')} className="text-xs bg-thm-accent text-white px-2 py-1 rounded hover:bg-thm-accentDim">History</button>
                        </div>
                        
                        <div className="bg-thm-surface rounded-lg shadow-sm border border-thm-border overflow-hidden py-2">
                            {navItems.map(item => (
                                <button 
                                    key={item.name}
                                    onClick={() => setActiveTab(item.name)}
                                    className={`w-full text-left px-6 py-3 text-sm flex items-center gap-3 transition-colors ${activeTab === item.name ? 'nav-item active' : 'nav-item'}`}
                                >
                                    {item.name}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1">
                        {activeTab === 'General Settings' && (
                            <div className="bg-thm-surface rounded-lg shadow-sm border border-thm-border p-8">
                                <div className="flex items-center gap-3 mb-8">
                                    <span className="text-thm-accent text-2xl">⚙️</span>
                                    <h1 className="text-2xl font-bold text-thm-textPrimary">General Settings</h1>
                                </div>

                                {/* Form Grid */}
                                <div className="grid grid-cols-2 gap-x-12 gap-y-8 mb-12">
                                    <div>
                                        <h3 className="font-bold text-thm-textPrimary mb-2">Title</h3>
                                        <p className="text-thm-textMuted text-sm">What do you want to call this room?</p>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-thm-textMuted block mb-1">Title*</label>
                                        <input type="text" className="w-full bg-thm-base border border-thm-border rounded p-2 text-sm text-thm-textPrimary focus:outline-none focus:border-thm-accent" 
                                            value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} />
                                        <p className="text-[10px] text-thm-textMuted mt-1">Max character count is 45.</p>
                                    </div>

                                    <div className="border-t border-thm-border col-span-2"></div>

                                    <div>
                                        <h3 className="font-bold text-thm-textPrimary mb-2">Description</h3>
                                        <p className="text-thm-textMuted text-sm">Add a short description explaining what this room covers and who it is suitable for.</p>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-thm-textMuted block mb-1">Description*</label>
                                        <textarea className="w-full bg-thm-base border border-thm-border rounded p-2 text-sm h-24 text-thm-textPrimary focus:outline-none focus:border-thm-accent" 
                                            value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})}></textarea>
                                        <p className="text-[10px] text-thm-textMuted mt-1">Max character count is 250.</p>
                                    </div>

                                    <div className="border-t border-thm-border col-span-2"></div>

                                    <div>
                                        <h3 className="font-bold text-thm-textPrimary mb-2">Room code</h3>
                                        <p className="text-thm-textMuted text-sm">The code people use to enter your room. The room code determines the room's url.</p>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-thm-textMuted block mb-1">Room code*</label>
                                        <div className="flex">
                                            <input type="text" className="flex-1 bg-thm-elevated border border-thm-border rounded-l p-2 text-sm text-thm-textMuted" disabled value={formData.roomCode} />
                                            <button className="bg-thm-accent text-white px-4 py-2 rounded-r text-sm font-bold hover:bg-thm-accentDim">Edit</button>
                                        </div>
                                    </div>

                                    <div className="border-t border-thm-border col-span-2"></div>

                                    <div>
                                        <h3 className="font-bold text-thm-textPrimary mb-2">Room completion time</h3>
                                        <p className="text-thm-textMuted text-sm">Estimate how long it will take users to complete the room.</p>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-thm-textMuted block mb-1">Completion time*</label>
                                        <div className="flex items-center gap-3">
                                            <input type="number" className="w-24 bg-thm-base border border-thm-border rounded p-2 text-sm text-center text-thm-textPrimary focus:border-thm-accent focus:outline-none" value={formData.completionTime} onChange={e => setFormData({...formData, completionTime: e.target.value})} />
                                            <span className="text-sm text-thm-textMuted">minutes</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Room Settings Card */}
                                <div className="border border-thm-border rounded-lg overflow-hidden">
                                    <div className="bg-thm-elevated border-b border-thm-border px-6 py-4 flex items-center gap-2">
                                        <span className="text-thm-accent">📄</span>
                                        <h2 className="font-bold text-thm-textPrimary text-lg">Room Settings</h2>
                                    </div>
                                    <div className="p-6">
                                        {/* Status */}
                                        <div className="flex justify-between items-start mb-6">
                                            <div className="w-1/2">
                                                <h3 className="font-bold text-thm-textPrimary mb-1">Status</h3>
                                                <p className="text-sm text-thm-textMuted">This is the status of your room.</p>
                                            </div>
                                            <div className="w-1/2">
                                                <span className="bg-thm-border text-thm-textPrimary text-xs px-3 py-1 rounded-full font-medium">● Not Submitted</span>
                                            </div>
                                        </div>
                                        <div className="border-t border-thm-border mb-6"></div>

                                        {/* Difficulty */}
                                        <div className="flex justify-between items-start mb-6">
                                            <div className="w-1/2">
                                                <h3 className="font-bold text-thm-textPrimary mb-1">Difficulty</h3>
                                                <p className="text-sm text-thm-textMuted">How difficult is the room?</p>
                                            </div>
                                            <div className="w-1/2 space-y-3">
                                                {['Info', 'Easy', 'Medium', 'Hard', 'Insane'].map(diff => (
                                                    <label key={diff} className="flex items-center gap-3 cursor-pointer group">
                                                        <input type="radio" name="difficulty" checked={formData.difficulty === diff} onChange={() => setFormData({...formData, difficulty: diff})} 
                                                            className="w-4 h-4 text-thm-accent focus:ring-thm-accent bg-thm-base border-thm-border" />
                                                        <span className="text-sm text-thm-textMuted group-hover:text-thm-textPrimary">{diff}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="border-t border-thm-border mb-6"></div>

                                        {/* Cloning */}
                                        <div className="flex justify-between items-start mb-6">
                                            <div className="w-1/2 pr-8">
                                                <h3 className="font-bold text-thm-textPrimary mb-1">Cloning</h3>
                                                <p className="text-sm text-thm-textMuted">A cloneable room means anyone who joins your room can clone and repurpose it.</p>
                                            </div>
                                            <div className="w-1/2 flex items-center gap-3">
                                                <Toggle id="cloning" checked={formData.cloning} onChange={e => setFormData({...formData, cloning: e.target.checked})} />
                                                <span className="text-sm text-thm-textMuted">Enable cloning</span>
                                            </div>
                                        </div>
                                        <div className="border-t border-thm-border mb-6"></div>

                                        {/* Access */}
                                        <div className="flex justify-between items-start mb-6">
                                            <div className="w-1/2 pr-8">
                                                <h3 className="font-bold text-thm-textPrimary mb-1">Access</h3>
                                                <p className="text-sm text-thm-textMuted">Rooms can be private, where only users with the room link can join and see room content; or public, where everyone on the platform can join.</p>
                                            </div>
                                            <div className="w-1/2 flex items-center gap-3">
                                                <Toggle id="access" checked={formData.access} onChange={e => setFormData({...formData, access: e.target.checked})} />
                                                <span className="text-sm text-thm-textMuted">Publicly accessible</span>
                                            </div>
                                        </div>
                                        <div className="border-t border-thm-border mb-6"></div>

                                        {/* Private Room Message */}
                                        <div className="flex justify-between items-start mb-6">
                                            <div className="w-1/2 pr-8">
                                                <h3 className="font-bold text-thm-textPrimary mb-1">Private room message</h3>
                                                <p className="text-sm text-thm-textMuted">Optional message shown to users when the room is private. Leave blank to use the default message.</p>
                                            </div>
                                            <div className="w-1/2">
                                                <label className="text-xs font-bold text-thm-textMuted block mb-1">Private room message</label>
                                                <textarea className="w-full bg-thm-base border border-thm-border rounded p-2 text-sm h-20 text-thm-textPrimary focus:outline-none focus:border-thm-accent" 
                                                    placeholder="e.g. This room is private for a scheduled event..."
                                                    value={formData.privateMessage} onChange={e => setFormData({...formData, privateMessage: e.target.value})}></textarea>
                                            </div>
                                        </div>
                                        
                                        <div className="mt-8 flex justify-end">
                                            <button onClick={handleSave} className="bg-thm-accent hover:bg-thm-accentDim text-white font-bold py-2 px-8 rounded shadow">
                                                Save Settings
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'Tasks' && (
                            <div className="bg-thm-surface rounded-lg shadow-sm border border-thm-border p-8">
                                <div className="flex justify-between items-center mb-6 pb-4 border-b border-thm-border">
                                    <div className="flex items-center gap-3">
                                        <span className="text-[#2c84f0] text-2xl">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                        </span>
                                        <h1 className="text-xl font-bold text-thm-textPrimary">Room tasks</h1>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => {
                                            const newTask = { id: Date.now(), title: 'New Task', description: '', questions: [] };
                                            setFormData({...formData, tasks: [...formData.tasks, newTask]});
                                        }} className="bg-thm-base border border-thm-border text-thm-textPrimary px-4 py-1.5 rounded text-sm font-medium hover:bg-thm-elevated transition-colors flex items-center gap-2">
                                            <span className="text-thm-textMuted text-lg leading-none">+</span> Add task
                                        </button>
                                        <button className="bg-thm-base border border-thm-border text-thm-textPrimary px-4 py-1.5 rounded text-sm font-medium hover:bg-thm-elevated transition-colors flex items-center gap-2">
                                            <svg className="w-4 h-4 text-thm-textMuted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> Task tips
                                        </button>
                                    </div>
                                </div>
                                
                                {formData.tasks.length === 0 ? (
                                    <div className="border border-dashed border-thm-border p-8 text-center rounded-lg">
                                        <p className="text-thm-textMuted mb-4">No tasks added yet.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        {formData.tasks.map((task, taskIndex) => (
                                            <div key={task.id} className="border border-thm-border rounded-lg overflow-hidden bg-thm-base">
                                                <div className="bg-thm-elevated border-b border-thm-border px-6 py-4 flex justify-between items-center">
                                                    <input type="text" className="font-bold text-thm-textPrimary bg-transparent border-none focus:outline-none focus:ring-2 focus:ring-thm-accent rounded px-2 py-1 w-1/2" 
                                                        value={task.title} onChange={e => {
                                                            const newTasks = [...formData.tasks];
                                                            newTasks[taskIndex].title = e.target.value;
                                                            setFormData({...formData, tasks: newTasks});
                                                        }} />
                                                    <button onClick={() => {
                                                        const newTasks = formData.tasks.filter((_, i) => i !== taskIndex);
                                                        setFormData({...formData, tasks: newTasks});
                                                    }} className="text-thm-danger hover:text-red-400 text-sm font-medium">Delete Task</button>
                                                </div>
                                                <div className="p-6">
                                                    <label className="text-xs font-bold text-thm-textMuted block mb-2">Description</label>
                                                    <textarea className="w-full bg-thm-elevated border border-thm-border rounded p-3 text-sm h-32 focus:outline-none focus:border-thm-accent mb-6 font-mono text-thm-textPrimary" 
                                                        placeholder="Markdown supported..."
                                                        value={task.description} onChange={e => {
                                                            const newTasks = [...formData.tasks];
                                                            newTasks[taskIndex].description = e.target.value;
                                                            setFormData({...formData, tasks: newTasks});
                                                        }}></textarea>
                                                        
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h4 className="font-bold text-thm-textPrimary">Questions</h4>
                                                        <button onClick={() => {
                                                            const newTasks = [...formData.tasks];
                                                            newTasks[taskIndex].questions.push({ id: Date.now(), text: '', answer: '', points: 10 });
                                                            setFormData({...formData, tasks: newTasks});
                                                        }} className="text-thm-info hover:text-blue-400 text-sm font-medium">+ Add Question</button>
                                                    </div>
                                                    
                                                    {task.questions.map((q, qIndex) => (
                                                        <div key={q.id} className="bg-thm-elevated border border-thm-border p-4 rounded mb-3">
                                                            <div className="flex justify-between items-start mb-2">
                                                                <label className="text-xs font-bold text-thm-textMuted">Question {qIndex + 1}</label>
                                                                <button onClick={() => {
                                                                    const newTasks = [...formData.tasks];
                                                                    newTasks[taskIndex].questions = newTasks[taskIndex].questions.filter((_, i) => i !== qIndex);
                                                                    setFormData({...formData, tasks: newTasks});
                                                                }} className="text-thm-danger hover:text-red-400 text-xs font-bold">X</button>
                                                            </div>
                                                            <input type="text" placeholder="Question text..." className="w-full bg-thm-base border border-thm-border rounded p-2 text-sm mb-3 focus:outline-none focus:border-thm-accent text-thm-textPrimary" 
                                                                value={q.text} onChange={e => {
                                                                    const newTasks = [...formData.tasks];
                                                                    newTasks[taskIndex].questions[qIndex].text = e.target.value;
                                                                    setFormData({...formData, tasks: newTasks});
                                                                }} />
                                                            <div className="flex gap-4">
                                                                <div className="flex-1">

                                        <div>
                                            <div className="flex items-center gap-2 text-white font-medium mb-3">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                                Users
                                            </div>
                                            <div className="text-[#8CC63F] text-3xl font-bold">0</div>
                                        </div>
                                        <div>
                                            <div className="flex items-center gap-2 text-white font-medium mb-3">
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                Completed
                                            </div>
                                            <div className="text-[#8CC63F] text-3xl font-bold">0</div>
                                        </div>
                                    </div>
                                    <div className="absolute right-0 top-0 bottom-0 opacity-40">
                                        <svg width="200" height="100%" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M150 20 H190 V60 H150 Z" fill="#2c84f0" />
                                            <circle cx="130" cy="50" r="20" fill="#2c84f0" />
                                            <path d="M100 90 Q130 50 160 90 Z" fill="#2c84f0" />
                                            <path d="M160 30 L180 50 L170 50 V60 H150 V50 L140 50 Z" fill="#1e293b" />
                                        </svg>
                                    </div>
                                </div>

                                {/* Controls Row */}
                                <div className="flex justify-between items-center mb-6">
                                    <div className="relative w-72">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-thm-textMuted">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                        </div>
                                        <input type="text" className="w-full bg-thm-base border border-thm-border rounded py-2 pl-10 pr-4 text-sm text-thm-textPrimary focus:outline-none focus:border-thm-accent" placeholder="Search for username" />
                                    </div>
                                    
                                    <div className="flex gap-4 items-center">
                                        <button className="bg-thm-border text-thm-textMuted px-4 py-2 rounded text-sm font-medium flex items-center gap-2 cursor-not-allowed opacity-70">
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                            Download task progress
                                        </button>
                                        <div className="flex items-center gap-2 text-sm text-thm-textPrimary">
                                            <span>show</span>
                                            <select className="bg-thm-base border border-thm-border rounded px-3 py-1 text-sm focus:outline-none focus:border-thm-accent appearance-none pr-8 relative">
                                                <option>10</option>
                                                <option>25</option>
                                                <option>50</option>
                                            </select>
                                            <span>records</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Table */}
                                <div className="border border-thm-border rounded-lg overflow-hidden bg-thm-base mb-4">
                                    <div className="grid grid-cols-4 gap-4 p-4 border-b border-thm-border bg-thm-elevated font-medium text-sm text-thm-textPrimary">
                                        <div className="flex items-center gap-1 cursor-pointer hover:text-thm-accent">Rank in room <span className="text-thm-textMuted">↓</span></div>
                                        <div className="flex items-center gap-1 cursor-pointer hover:text-thm-accent">Username <span className="text-thm-textMuted">↓</span></div>
                                        <div className="flex items-center gap-1 cursor-pointer hover:text-thm-accent">Questions Complete <span className="text-thm-textMuted">↓</span></div>
                                        <div className="flex items-center gap-1 cursor-pointer hover:text-thm-accent">Points in room <span className="text-thm-textMuted">↓</span></div>
                                    </div>
                                    
                                    {/* Empty State */}
                                    <div className="py-24 px-4 text-center">
                                        <h3 className="font-bold text-lg text-thm-textPrimary mb-2">This room has not been started by users yet</h3>
                                        <p className="text-thm-textMuted">Come back to this space later for user stats</p>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'Write-ups' && (
                            <div className="space-y-6">
                                {/* Official Write-up Card */}
                                <div className="bg-thm-surface rounded-lg shadow-sm border border-thm-border p-8">
                                    <div className="flex items-center gap-3 mb-6">
                                        <span className="text-[#2c84f0] text-2xl">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                        </span>
                                        <h2 className="text-xl font-bold text-thm-textPrimary">Write-up</h2>
                                    </div>
                                    
                                    <div className="flex justify-between items-start border-b border-thm-border pb-8">
                                        <div className="w-1/2 pr-8">
                                            <h3 className="font-bold text-thm-textPrimary text-lg mb-2">Official write-up</h3>
                                            <p className="text-sm text-thm-textMuted">Public challenge rooms need to include a write-up.</p>
                                        </div>
                                        <div className="w-1/2">
                                            <label className="text-xs font-bold text-thm-textMuted block mb-2">Write-up URL</label>
                                            <div className="flex gap-2 mb-2">
                                                <input type="text" className="flex-1 bg-thm-base border border-thm-border rounded p-2 text-sm text-thm-textPrimary focus:outline-none focus:border-thm-accent" />
                                                <button className="bg-[#2c84f0] hover:bg-blue-600 text-white px-6 py-2 rounded text-sm font-bold shadow">
                                                    Save
                                                </button>
                                            </div>
                                            <p className="text-[10px] text-thm-textMuted">Private link to download the write-up from</p>
                                        </div>
                                    </div>
                                </div>
                                
                                {/* Community Write-ups Card */}
                                <div className="bg-thm-surface rounded-lg shadow-sm border border-thm-border p-8">
                                    <div className="flex items-center gap-3 mb-6">
                                        <span className="text-[#2c84f0] text-2xl">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                        </span>
                                        <h2 className="text-xl font-bold text-thm-textPrimary">Community write-ups</h2>
                                    </div>
                                    
                                    <div className="bg-[#1e293b] border border-[#3b82f6] border-opacity-30 rounded-lg p-6 text-center text-sm font-medium text-thm-textMuted">
                                        There are no community write-ups yet.
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'Reset' && (
                            <div className="bg-thm-surface rounded-lg shadow-sm border border-thm-border p-8">
                                <div className="flex items-center gap-3 mb-6">
                                    <span className="text-[#ffb703] text-2xl">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                    </span>
                                    <h2 className="text-xl font-bold text-thm-textPrimary">Reset Room Statistics</h2>
                                </div>
                                <p className="text-sm text-thm-textMuted mb-6">
                                    This will permanently wipe all user progress, leaderboard standings, and completion data for this room. The room configuration and tasks will remain intact.
                                </p>
                                <button className="bg-[#ffb703] hover:bg-yellow-600 text-[#331100] px-6 py-2 rounded text-sm font-bold shadow">
                                    Reset Progress
                                </button>
                            </div>
                        )}
                        
                        {activeTab === 'Delete' && (
                            <div className="bg-thm-surface rounded-lg shadow-sm border border-thm-border p-8">
                                <div className="flex items-center gap-3 mb-6">
                                    <span className="text-thm-danger text-2xl">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    </span>
                                    <h2 className="text-xl font-bold text-thm-textPrimary">Delete</h2>
                                </div>
                                <p className="text-sm text-thm-textMuted mb-6">
                                    If the room is deleted, you will not be able to recover it.
                                </p>
                                <button className="bg-thm-danger hover:bg-red-700 text-white px-6 py-2 rounded text-sm font-bold shadow">
                                    Delete room
                                </button>
                            </div>
                        )}
                    </div>
                    
                    {/* Success Modal */}
                    {showSuccessModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
                            <div className="bg-thm-surface border border-thm-border rounded-lg shadow-2xl p-8 max-w-sm w-full text-center">
                                <div className="w-16 h-16 bg-thm-elevated rounded-full flex items-center justify-center mx-auto mb-4 border border-[#00ff88]">
                                    <svg className="w-8 h-8 text-[#00ff88]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <h3 className="text-xl font-bold text-thm-textPrimary mb-2">Success!</h3>
                                <p className="text-thm-textMuted mb-8 text-sm">Room saved successfully.</p>
                                <button 
                                    onClick={() => {
                                        setShowSuccessModal(false);
                                        window.location.href = `http://127.0.0.1:5000/room/${savedRoomId}`;
                                    }} 
                                    className="w-full bg-thm-accent hover:bg-thm-accentDim text-white font-bold py-3 px-4 rounded shadow transition-colors"
                                >
                                    OK, take me to the room
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-state.js"></script>
</body>
</html>
