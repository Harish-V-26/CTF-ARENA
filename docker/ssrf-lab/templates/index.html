<!DOCTYPE html>
<html>
<head>
    <title>SecureCorp API Dashboard - Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; margin: 0; padding: 20px; color: #f1f5f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { background: #1e293b; max-width: 400px; width: 100%; padding: 40px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #475569; background: #0f172a; color: #f1f5f9; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: #38bdf8; outline: none; }
        button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .hint { color: #94a3b8; font-size: 0.875rem; text-align: center; margin-top: 20px; border-top: 1px dashed #334155; padding-top: 15px; }
        code { background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SecureCorp API Integrations</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="hint">
            <strong>Hint:</strong> Use <code>employee_john</code> / <code>password123</code>
        </div>
    </div>
</body>
</html>
