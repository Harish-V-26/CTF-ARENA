server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Custom header for general responses
    add_header X-Powered-By "SecureCorp-Portal/2.4.1";

    location / {
        try_files $uri $uri/ =404;
    }

    # The fake banner image intentionally returns 404 with the flag in a header
    location /assets/banner-q2-2026.png {
        add_header X-Flag-Part2 "power_";
        add_header X-Debug-Info "This asset was deprecated in Q1. Check the header above.";
        add_header Access-Control-Expose-Headers "X-Flag-Part2, X-Debug-Info";
        return 404 "Asset not found";
    }
}
