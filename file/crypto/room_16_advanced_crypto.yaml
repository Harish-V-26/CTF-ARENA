id: 16
title: "Modern & Post-Quantum Crypto"
slug: "modern-crypto"
difficulty: "hard"
description: "Explore the cutting-edge of cryptography, including Elliptic Curves, Zero-Knowledge Proofs, and the Quantum threat."
order: 16

challenges:
  - id: adv-qa-1
    type: qa
    title: "Elliptic Curve Cryptography (ECC)"
    points: 60
    content: |
      Elliptic Curve Cryptography (ECC) is an advanced asymmetric encryption technique based on the algebraic structure of elliptic curves.
      - Benefit: ECC provides the same level of security as RSA but with significantly smaller key sizes. (e.g., A 256-bit ECC key is as secure as a 3072-bit RSA key).
      - This makes ECC ideal for mobile devices, IoT, and modern web servers where processing power and bandwidth are limited.
    questions:
      - q: "What does ECC stand for?"
        a: "Elliptic Curve Cryptography"
      - q: "Which has smaller key sizes for the same security level: RSA or ECC?"
        a: "ECC"
      - q: "Is ECC a symmetric or asymmetric cryptographic algorithm?"
        a: "Asymmetric"
      - q: "Because of its efficiency, ECC is highly popular for what type of devices?"
        a: "Mobile devices"
      - q: "What mathematical structure does ECC rely on?"
        a: "Elliptic curves"

  - id: adv-qa-2
    type: qa
    title: "Zero-Knowledge Proofs (ZKP)"
    points: 60
    content: |
      A Zero-Knowledge Proof (ZKP) is a cryptographic method by which one party (the prover) can prove to another party (the verifier) that they know a specific piece of information, WITHOUT revealing the information itself.
      - Example: Proving you are over 18 without showing your exact birth date.
      - Use cases: Privacy-focused cryptocurrencies (like Zcash), secure authentication without transmitting passwords.
    questions:
      - q: "What cryptographic method allows proving knowledge without revealing the data?"
        a: "Zero-Knowledge Proof"
      - q: "In a ZKP, what is the party called who is trying to prove their knowledge?"
        a: "Prover"
      - q: "What is the party called who checks if the proof is valid?"
        a: "Verifier"
      - q: "Does a ZKP require sending the actual secret over the network?"
        a: "No"
      - q: "Are Zero-Knowledge Proofs used to enhance privacy or speed?"
        a: "Privacy"

  - id: adv-qa-3
    type: qa
    title: "Homomorphic Encryption"
    points: 60
    content: |
      Traditional encryption requires data to be decrypted before it can be processed or analyzed. 
      Homomorphic Encryption allows computations to be performed directly on ciphertext. The result, when decrypted, matches the result of the operations as if they had been performed on the plaintext.
      - Use Case: Secure cloud computing. You can send encrypted medical data to a cloud AI, the AI analyzes it while encrypted, and returns an encrypted diagnosis.
    questions:
      - q: "What type of encryption allows calculations to be performed on ciphertext?"
        a: "Homomorphic Encryption"
      - q: "Do you need to decrypt the data first to analyze it with Homomorphic Encryption?"
        a: "No"
      - q: "What environment highly benefits from this to process untrusted data securely?"
        a: "Cloud computing"
      - q: "If you add two homomorphically encrypted numbers, is the result encrypted or plaintext?"
        a: "Encrypted"
      - q: "When the result is finally decrypted, does it match the plaintext computation?"
        a: "Yes"

  - id: adv-qa-4
    type: qa
    title: "The Quantum Threat"
    points: 60
    content: |
      Quantum computers use quantum bits (qubits). Due to quantum superposition, they can process vast numbers of possibilities simultaneously.
      - Shor's Algorithm: A quantum algorithm that can factor large prime numbers exponentially faster than classical computers.
      - The Threat: Shor's algorithm will completely break modern asymmetric cryptography like RSA, ECC, and Diffie-Hellman once quantum computers become powerful enough.
    questions:
      - q: "What is the basic unit of information in a quantum computer called?"
        a: "Qubit"
      - q: "What quantum algorithm poses a fatal threat to RSA and ECC?"
        a: "Shor's Algorithm"
      - q: "Does Shor's Algorithm target symmetric or asymmetric cryptography?"
        a: "Asymmetric"
      - q: "What mathematical problem does Shor's Algorithm solve rapidly?"
        a: "Factoring large primes"
      - q: "What principle allows qubits to exist in multiple states at once?"
        a: "Superposition"

  - id: adv-qa-5
    type: qa
    title: "Post-Quantum Cryptography (PQC)"
    points: 60
    content: |
      Post-Quantum Cryptography (PQC) refers to cryptographic algorithms (usually public-key algorithms) that are thought to be secure against a cryptanalytic attack by a quantum computer.
      - NIST is currently standardizing new algorithms, mostly based on complex mathematical concepts like Lattice-based cryptography, which quantum computers struggle to solve.
      - Transitioning to PQC is critical because adversaries may use "Harvest Now, Decrypt Later" attacks—recording encrypted traffic today to decrypt it in the future when quantum computers exist.
    questions:
      - q: "What does PQC stand for?"
        a: "Post-Quantum Cryptography"
      - q: "What US agency is heavily involved in standardizing PQC algorithms?"
        a: "NIST"
      - q: "What is the most popular mathematical basis for new post-quantum algorithms?"
        a: "Lattice-based"
      - q: "What attack involves stealing encrypted data today to crack it years in the future?"
        a: "Harvest Now, Decrypt Later"
      - q: "Are PQC algorithms designed to run on classical computers or quantum computers?"
        a: "Classical computers"

  - id: adv-flag-1
    type: flag
    title: "Future Proof"
    points: 60
    content: |
      The transition to Post-Quantum Cryptography is one of the most significant upgrades in internet history. To prove you understand the timeline, what acronym refers to the strategy where attackers steal data today to break it tomorrow?
    flag: "CTF{HNDL}"
