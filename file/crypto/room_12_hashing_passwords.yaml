challenges:
  - id: hash-qa-1
    type: qa
    title: "Secure Hash Functions"
    points: 10
    content: |
      Hashing is a one-way mathematical function that converts data of any size into a fixed-size string of characters. It is fundamental for verifying data integrity and storing passwords safely.
      
      PROPERTIES OF A SECURE HASH FUNCTION:
      1. Deterministic: The same input always produces the exact same output.
      2. Fast to compute: Easy to generate the hash for any given message.
      3. Pre-image resistance: Computationally infeasible to reverse the hash to find the original input.
      4. Avalanche Effect: A tiny change in input (e.g., one bit) completely changes the output hash.
      5. Collision resistance: Hard to find two different inputs that produce the same exact hash.
      
      COMMON HASH ALGORITHMS:
      - MD5: Produces a 128-bit hash. Obsolete and vulnerable to collisions. DO NOT USE.
      - SHA-1: Produces a 160-bit hash. Vulnerable to collisions (shattered attack). Deprecated.
      - SHA-256 / SHA-3: Modern, secure hashing standards used today.
    questions:
      - q: "What property of a hash function ensures that changing just one letter in a document drastically changes the resulting hash?"
        a: "Avalanche Effect"
      - q: "Which older hashing algorithm produces a 128-bit hash and is now considered highly vulnerable to collisions?"
        a: "MD5"

  - id: hash-qa-2
    type: qa
    title: "Password Storage"
    points: 10
    content: |
      PASSWORD STORAGE:
      Never store passwords in plain text, and never use basic hashing (like standard SHA-256) alone. Attackers use precomputed tables (Rainbow Tables) to instantly crack standard hashes.
      
      - Salting: Adding a unique, random string (salt) to each user's password before hashing. This prevents Rainbow Table attacks and ensures identical passwords have different hashes.
      - Key Stretching: Using slow, resource-intensive hashing algorithms to make brute-force and dictionary attacks mathematically impractical.
      - Secure Password Algorithms: bcrypt, Argon2, PBKDF2.
    questions:
      - q: "What random string is added to a password before hashing to completely defeat precomputed rainbow table attacks?"
        a: "Salt"
      - q: "Which of the following is a recommended, deliberately slow algorithm specifically designed for securely hashing passwords?"
        a: "bcrypt"

