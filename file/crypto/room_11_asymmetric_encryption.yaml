challenges:
  - id: asym-qa-1
    type: qa
    title: "Public-Key Cryptography"
    points: 10
    content: |
      Asymmetric encryption (Public-Key Cryptography) uses two mathematically linked keys: a Public Key (shared openly) and a Private Key (kept secret).
      
      HOW IT WORKS:
      - Encryption: Data encrypted with the Public Key can ONLY be decrypted with the Private Key. Anyone can send a secure message, but only the owner can read it.
      - Digital Signatures: Data "encrypted" (signed) with the Private Key can be verified by the Public Key. Proves authenticity and non-repudiation.
      
      COMMON ALGORITHMS:
      - RSA: Based on the mathematical difficulty of factoring large prime numbers. Widely used for key exchange and digital signatures.
      - ECC (Elliptic Curve Cryptography): Based on the algebraic structure of elliptic curves. Offers the same security as RSA but with much smaller key sizes (faster, less processing power).
      - Diffie-Hellman (DH): Not used for encryption, but a mathematical method to securely exchange a symmetric key over an insecure channel.
    questions:
      - q: "In asymmetric encryption, if you want someone to send you a secure message, which key do you give them?"
        a: "Public Key"
      - q: "Which asymmetric algorithm relies on the mathematical difficulty of factoring extremely large prime numbers?"
        a: "RSA"

  - id: asym-qa-2
    type: qa
    title: "Public Key Infrastructure (PKI)"
    points: 10
    content: |
      PUBLIC KEY INFRASTRUCTURE (PKI):
      PKI is the framework that manages digital certificates and public-key encryption.
      - Digital Certificate: An electronic document that binds a public key to an entity's identity.
      - CA (Certificate Authority): A trusted third party that issues and signs digital certificates (e.g., Let's Encrypt, DigiCert).
      
      HYBRID ENCRYPTION:
      Asymmetric encryption is computationally heavy and slow. In practice (like HTTPS/TLS), asymmetric encryption is used to securely exchange a temporary symmetric key (session key). Then, symmetric encryption is used for the actual high-speed data transfer.
    questions:
      - q: "What trusted entity is responsible for issuing and signing digital certificates in a PKI?"
        a: "Certificate Authority"
      - q: "What is an electronic document that binds a public key to an entity's identity?"
        a: "Digital Certificate"

  - id: asym-flag-1
    type: flag
    title: "The Private Key"
    points: 50
    content: |
      In RSA, the public key consists of the modulus 'n' and the public exponent 'e'. The private key consists of the private exponent 'd'.
      If an attacker can factor 'n' into its prime components 'p' and 'q', they can calculate 'd' and steal your secrets.
      What is the abbreviation of the algorithm invented by Rivest, Shamir, and Adleman?
      Wrap it in CTF{...}.
    flag: "CTF{RSA}"
