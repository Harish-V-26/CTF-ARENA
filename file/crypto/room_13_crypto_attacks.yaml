challenges:
  - id: attack-qa-1
    type: qa
    title: "Attack Models & Brute Force"
    points: 10
    content: |
      Cryptanalysis is the study of analyzing information systems to uncover hidden aspects. Attackers use various techniques to break cryptographic protections.
      
      BRUTE FORCE & DICTIONARY ATTACKS:
      - Brute Force: Trying absolutely every possible key or password combination until the correct one is found.
      - Dictionary Attack: Trying a precompiled list of common words, phrases, and previously leaked passwords (e.g., rockyou.txt).
      
      ATTACK MODELS:
      - Ciphertext-Only Attack: Attacker only has access to the encrypted data. Hardest attack.
      - Known-Plaintext Attack: Attacker has both the ciphertext and its corresponding plaintext. They try to figure out the key.
      - Chosen-Plaintext Attack: Attacker can choose plaintexts and see the resulting ciphertexts. Useful for breaking weak algorithms.
    questions:
      - q: "What attack uses a large, precompiled list of common words and known leaked passwords?"
        a: "Dictionary Attack"
      - q: "Which attack model involves the attacker being able to select the text to be encrypted and analyzing the resulting ciphertext?"
        a: "Chosen-Plaintext Attack"

  - id: attack-qa-2
    type: qa
    title: "Specific Cryptographic Attacks"
    points: 10
    content: |
      SPECIFIC ATTACKS:
      - Birthday Attack: A statistical attack aimed at finding collisions in hash functions. Based on the birthday paradox (you only need 23 people in a room to have a 50% chance two share a birthday).
      - Downgrade Attack: Forcing a system to abandon a secure connection protocol (like TLS 1.3) and use an older, vulnerable one (like SSL 3.0).
      - Length Extension Attack: Exploiting the fact that for certain hashes (like SHA-1), if you know Hash(M), you can calculate Hash(M || appended_data).
      - Side-Channel Attack: Exploiting physical implementations of the cryptosystem, such as power consumption, timing, or electromagnetic leaks, to deduce the secret key.
    questions:
      - q: "What statistical attack is specifically used to find mathematically probable collisions in hashing algorithms?"
        a: "Birthday Attack"
      - q: "Exploiting a physical device's power consumption or processing time to steal keys is known as what type of attack?"
        a: "Side-Channel Attack"

  - id: attack-flag-1
    type: flag
    title: "Downgraded Protocol"
    points: 50
    content: |
      The POODLE attack (Padding Oracle On Downgraded Legacy Encryption) was a notorious man-in-the-middle exploit. It relied on forcing a secure connection to downgrade to an obsolete protocol.
      What old version of SSL did POODLE force targets to downgrade to?
      Format the flag as CTF{SSLvX} where X is the version number.
    flag: "CTF{SSLv3}"
