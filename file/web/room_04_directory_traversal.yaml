id: 4
title: "Directory Traversal"
slug: "directory-traversal"
difficulty: "easy"
description: "Learn how path traversal works and how to read files outside the web root."
order: 4

challenges:
  - id: dt-qa-1
    type: qa
    title: "Path Traversal Basics"
    points: 10
    content: |
      Directory Traversal (also called Path Traversal) is a vulnerability that
      allows attackers to read files outside the web server's intended directory.

      Web servers typically serve files from a specific folder (e.g., /var/www/html).
      If an application takes a filename from user input without validation:

        http://site.com/view?file=report.pdf

      An attacker can traverse directories using ../ (dot-dot-slash):
        http://site.com/view?file=../../../etc/passwd

      The ../ moves up one directory level. Each ../ goes up one more level.

      On Linux, key files to read:
      - /etc/passwd: System user accounts (world-readable)
      - /etc/shadow: Password hashes (requires root)
      - /etc/hostname: Machine name
      - /proc/self/environ: Environment variables (may contain secrets)

      On Windows, key files to read:
      - C:\Windows\win.ini: Windows configuration
      - C:\boot.ini: Boot configuration

      Modern web frameworks often have built-in protections against path traversal,
      but custom file-serving code is frequently vulnerable.
    questions:
      - q: "What symbol sequence moves up one directory level?"
        a: "../"
      - q: "What Linux file contains system user account information?"
        a: "/etc/passwd"
      - q: "On Windows, what file contains Windows configuration info?"
        a: "C:\\Windows\\win.ini"

  - id: dt-qa-2
    type: qa
    title: "Defeating Path Traversal Filters"
    points: 10
    content: |
      Developers sometimes try to block path traversal by filtering "../".
      However, attackers can bypass these filters in several ways:

      1. URL Encoding:
         ../ -> %2e%2e%2f
         ..\ -> %2e%2e%5c

      2. Double URL Encoding:
         ../ -> %252e%252e%252f (if the app decodes twice)

      3. Using Absolute Paths:
         Instead of ../../../etc/passwd, use /etc/passwd directly

      4. Nested Traversal:
         ....// -> becomes ../ after filtering removes ".."

      5. Using Unicode:
         ..%c0%af (overlong UTF-8 encoding of / on older systems)

      6. Null Byte Injection (old PHP trick):
         ../../../etc/passwd%00.jpg
         The %00 (null byte) terminates the string, .jpg is ignored

      Best practices to prevent path traversal:
      - Use a whitelist of allowed filenames (not a blacklist)
      - Use a dedicated file access library
      - Avoid passing user input directly to file functions
    questions:
      - q: "What encoding replaces '.' with '%2e' and '/' with '%2f'?"
        a: "URL encoding"
      - q: "What character acts as a string terminator in old PHP applications?"
        a: "Null byte"
      - q: "What is better for file access: a whitelist or blacklist?"
        a: "Whitelist"

  - id: dt-flag-1
    type: flag
    title: "Read the Secret"
    points: 50
    content: |
      A website displays text files: /read?file=notes.txt
      The flag is stored in /var/www/flag.txt
      Use directory traversal to reach and read it.
    flag: "CTF{tr4v3rs3_4ll_th3_th1ngs}"
